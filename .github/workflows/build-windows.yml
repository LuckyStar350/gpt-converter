name: Build Windows package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt PyInstaller==6.17.0

      - name: Build portable packages
        run: python scripts/build_release.py

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: gpt-converter-packages
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
